services:
  video-editing-agents:
    build: .
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8787
      DATA_ROOT: /app/workspaces
      DATABASE_PATH: /app/data/video_agents.sqlite3
    volumes:
      - video_agents_data:/app/data
      - video_agents_workspaces:/app/workspaces

volumes:
  video_agents_data:
  video_agents_workspaces:
