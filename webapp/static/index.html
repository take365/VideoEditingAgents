<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VideoEditingAgents</title><link rel="stylesheet" href="/static/app.css"></head>
<body><div class="shell"><aside class="sidebar"><div class="brand"><span class="mark">動画</span><div><strong>VideoEditingAgents</strong><small>local workspace</small></div></div><button id="newProject" class="primary">＋ 新しい案件</button><div class="label">案件</div><div id="projects" class="project-list"></div><a class="nav-link" href="/static/help.html">台本フォーマット ヘルプ</a><div class="security-note"><strong>個人用・localhost</strong><br>案件領域外、外部送信、秘密情報、logsの変更は拒否します。</div></aside><main class="main"><header class="topbar"><div><span class="eyebrow">VIDEO WORKSPACE</span><h1 id="projectTitle">案件を選択してください</h1></div><div class="top-actions"><span id="codexStatus" class="status">Codex未接続</span><button id="codexLogin" class="secondary">Codexにログイン</button></div></header><section class="workspace"><div class="chat-column panel"><div class="panel-head"><div><h2>Codexチャット・素材</h2><p>台本、音声、背景を添付して、動画制作を指示します。</p></div><label class="upload">添付<input id="upload" type="file" multiple></label></div><div id="files" class="attachments"></div><div id="messages" class="messages"></div><form id="chatForm" class="composer"><input id="message" placeholder="例：この台本で短い横型動画を作って" autocomplete="off"><button class="primary">送信</button></form><div class="quick"><button data-message="字幕を大きくして">字幕を大きく</button><button data-message="VOICEVOXで音声を生成して">音声を生成</button><button data-message="この台本で動画を生成して">動画を生成</button><button data-message="現在の台本と設定を確認して">設定を確認</button></div></div><div class="preview-column"><section class="panel preview"><div class="panel-head"><div><h2>プレビュー</h2><p id="jobStatus">待機中</p></div><div class="preview-actions"><label class="orientation-control">画面 <select id="videoOrientation"><option value="landscape">横型標準</option><option value="portrait">縦型ショート</option></select></label><button id="render" class="primary">▶ 動画を生成</button></div></div><div id="player" class="player"><div class="empty">完成したMP4がここに表示されます</div></div><div id="artifacts" class="artifacts"></div></section></div></section></main></div><script src="/static/app.js"></script></body></html>
